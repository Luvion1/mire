# Configuration file for GoReleaser - Library Release
project_name: mire

before:
  hooks:
    - go mod tidy

# No builds section - this is a library, not a CLI tool

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: Luvion1
    name: mire
  draft: false
  prerelease: false
  mode: keep-existing
